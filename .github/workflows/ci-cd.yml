name: GridPulse CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    name: Automated Unit & Pipeline Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 14/14 Automated Unit Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Streamlit Dashboard syntax & compilation
        run: |
          python -c "import dashboard.app; print('Streamlit Dashboard syntax verified.')"

      - name: Verify Docker Build Sanity
        run: |
          docker build -t gridpulse-dashboard:test .

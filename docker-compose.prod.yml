version: '3.8'

services:
  # 1. Apache Kafka in KRaft Mode (No ZooKeeper dependency)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: gridpulse-prod-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: '4L622nShTUiD2cOnguEbog'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    networks:
      - gridpulse-prod-net

  # 2. Web UI for Kafka Monitoring & Topic Inspection
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: gridpulse-prod-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: GridPulse-Production-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
    networks:
      - gridpulse-prod-net

  # 3. Streamlit Operations Dashboard (8-Tab Command Center)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridpulse-prod-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./data/lake:/app/data/lake:ro
      - ./analysis/forecaster_model.joblib:/app/analysis/forecaster_model.joblib:ro
    depends_on:
      - kafka
    networks:
      - gridpulse-prod-net

networks:
  gridpulse-prod-net:
    driver: bridge

volumes:
  kafka_prod_data:
